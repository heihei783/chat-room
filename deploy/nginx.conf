# chat-app Nginx 配置
# 适用场景：nginx 在宿主机（或另一台服务器）做反向代理，Go 后端监听 9090（Docker 已映射到宿主机）
# 放置：/etc/nginx/conf.d/chat-app.conf → nginx -t 检查 → systemctl reload nginx
# 前端为同源部署：静态页面由 Go 托管，nginx 统一反代，前端无需任何改动

server {
    listen 80;
    server_name _;                    # 有域名就换成你的域名

    # 上传单文件最大 10MB（与后端 upload.max_size 一致；nginx 默认 1m 会拦截上传！）
    client_max_body_size 10m;

    # ---------- WebSocket（必须最先处理升级请求） ----------
    # location 匹配按最长前缀，/ws 比 / 优先，无需刻意排序，但显式写出便于维护
    location /ws {
        proxy_pass http://127.0.0.1:9090;      # 后端地址：宿主机映射端口
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;    # WebSocket 协议升级
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;                 # 心跳周期 54s，超时须大于心跳间隔
        proxy_send_timeout 3600s;
    }

    # ---------- 其余全部（REST API / 前端页面 / 上传文件静态访问） ----------
    location / {
        proxy_pass http://127.0.0.1:9090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

